name: redacted-document-llm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: redacted
      POSTGRES_USER: redacted
      POSTGRES_PASSWORD: redacted-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redacted -d redacted"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDACTED_ENVIRONMENT: development
      REDACTED_DATABASE_URL: postgresql://redacted:redacted-local@postgres:5432/redacted
      REDACTED_REDIS_URL: redis://redis:6379/0
      REDACTED_CORPUS_MANIFEST_PATH: /artifacts/corpus/manifest.json
      REDACTED_BM25_MANIFEST_PATH: /artifacts/corpus/bm25-manifest.json
      REDACTED_DENSE_MANIFEST_PATH: /artifacts/corpus/dense-manifest.json
      REDACTED_DENSE_ARTIFACT_DIRECTORY: /artifacts/corpus/dense
      REDACTED_OPENSEARCH_URL: http://opensearch:9200
      REDACTED_OPENAI_API_KEY: ${REDACTED_OPENAI_API_KEY:-}
      REDACTED_ALLOW_PAID_MODEL_CALLS: ${REDACTED_ALLOW_PAID_MODEL_CALLS:-false}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/readiness', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend-data:/var/lib/redacted
      - ${REDACTED_CORPUS_ROOT:-./var/corpus}:/artifacts/corpus:ro

  worker:
    profiles: ["retrieval"]
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      REDACTED_ENVIRONMENT: development
      REDACTED_DATABASE_URL: postgresql://redacted:redacted-local@postgres:5432/redacted
      REDACTED_REDIS_URL: redis://redis:6379/0
      REDACTED_CORPUS_MANIFEST_PATH: /artifacts/corpus/manifest.json
      REDACTED_BM25_MANIFEST_PATH: /artifacts/corpus/bm25-manifest.json
      REDACTED_DENSE_MANIFEST_PATH: /artifacts/corpus/dense-manifest.json
      REDACTED_DENSE_ARTIFACT_DIRECTORY: /artifacts/corpus/dense
      REDACTED_OPENSEARCH_URL: http://opensearch:9200
      REDACTED_OPENAI_API_KEY: ${REDACTED_OPENAI_API_KEY:-}
      REDACTED_ALLOW_PAID_MODEL_CALLS: ${REDACTED_ALLOW_PAID_MODEL_CALLS:-false}
    init: true
    volumes:
      - ${REDACTED_CORPUS_ROOT:-./var/corpus}:/artifacts/corpus:ro

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    profiles: ["retrieval"]
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms4g -Xmx4g
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:59200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${REDACTED_CORPUS_ROOT:-./var/corpus}/opensearch:/usr/share/opensearch/data

volumes:
  backend-data:
  postgres-data:
  redis-data:
