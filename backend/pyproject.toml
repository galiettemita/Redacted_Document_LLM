[project]
name = "redacted-document-backend"
version = "0.1.0"
description = "Visible-only retrieval-assisted backend for Redacted Document LLM"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.30,<2",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "opencv-python-headless>=4.11,<5",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "pytesseract>=0.3.13,<1",
  "pyyaml>=6,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "faiss-cpu>=1.10,<2",
  "sentence-transformers>=5.1,<6",
]

[project.scripts]
corpus = "redacted_backend.corpus.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redacted_backend"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.uv]
package = true
